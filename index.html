<style>
  :root {
    color-scheme: light;
    --green-dark: #0e7a3b;
    --green: #3bb24a;
    --slate: #4a544f;
    --bg: #ffffff;
    --muted: #6b7670;
    --tint: #f1f8f3;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--slate); text-align: center;
    background-image: radial-gradient(circle at 50% 0%, var(--tint), transparent 60%);
  }
  main { max-width: 560px; width: 100%; }
  .logo { width: 150px; height: auto; border-radius: 4px; animation: float 4s ease-in-out infinite; }
  .brand { margin-top: 8px; font-weight: 700; letter-spacing: .32em; color: var(--green-dark); font-size: 1.05rem; }
  h1 { margin-top: 36px; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.15; }
  h1 span { color: var(--green-dark); }
  p.lead { margin-top: 16px; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  .bar { margin: 36px auto 0; width: 220px; height: 6px; border-radius: 6px; background: var(--tint); overflow: hidden; border: 1px solid rgba(59,178,74,.25); }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--green-dark), var(--green)); animation: slide 1.8s ease-in-out infinite; }
  .contact { margin-top: 36px; font-size: .95rem; color: var(--muted); }
  .contact a { color: var(--green-dark); font-weight: 600; text-decoration: none; border-bottom: 1px solid currentColor; }
  footer { margin-top: 48px; font-size: .8rem; color: var(--muted); }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
